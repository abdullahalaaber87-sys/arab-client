plugins {
    id 'fabric-loom' version '1.7.+'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.arabclient'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.9'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.107.0+1.21.1'

    // Discord RPC (required for Discord Presence)
    modImplementation 'net.arikia.dev:java-discord-rpc:3.5.0'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom {
    inheritJars()
    splits {
        modApi {
            include "fabric:fabric-api"
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'arabclient'
            from components.java
        }
    }
}
